<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GR Colors — ferramentas de cor | GR Brands</title>
    <!-- A Inter e a Jersey 10 sao servidas da RAIZ do site (/Inter-*.woff2),
         os mesmos arquivos que o grbrands.com.br ja carrega — nao ha copia
         aqui dentro. Some a ida ao Google Fonts, some a tentacao dos pesos
         700/800/900 que nao existem na marca, e quem chega ao /colors vindo do
         site ja tem as fontes em cache. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica o tema antes da primeira pintura para evitar um clarão enquanto
         o React carrega. A preferência explícita vence a do sistema. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("grb-theme");
          if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {}
      })();
    </script>
    <meta
      name="description"
      content="GR Colors, uma ferramenta GR Brands para criar paletas, testar contraste, visualizar aplicações e exportar cores para seus projetos."
    />
    <!-- O icone e o mesmo do site principal, servido da raiz. Nao ha copia
         dentro de /colors/ de proposito: um arquivo solto ali seria confundido
         com um slug de paleta pela regra do _redirects (veja GRB/_redirects). -->
    <link rel="icon" href="%BASE_URL%Logo1-favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%Logo1-icone.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
